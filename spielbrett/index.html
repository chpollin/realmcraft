<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>RealmCraft</title>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/brett.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/dialoge.css">
  <link rel="stylesheet" href="css/kampagne.css">
  <link rel="stylesheet" href="css/rat-leiste.css">
  <link rel="stylesheet" href="css/weltgeschehen.css">
  <link rel="stylesheet" href="css/bestimmung.css">
  <link rel="stylesheet" href="css/ereignisse.css">
  <link rel="stylesheet" href="css/pfade.css">
  <link rel="stylesheet" href="css/shell.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#ortsliste" data-t="board.page.skip"></a>

  <header class="leiste">
    <div class="volk">
      <h1 class="volk-name" id="volk-name"></h1>
      <p class="zeit" id="zeit"></p>
    </div>
    <ul class="ressourcen" id="ressourcen" role="list" data-t-aria-label="board.topbar.stores"></ul>
    <button class="bestimmung-kurz has-tip" id="bestimmung-kurz" type="button" aria-keyshortcuts="B" aria-haspopup="dialog"></button>
    <nav class="kurzwahl" data-t-aria-label="board.topbar.overviews">
      <button class="kurz" type="button" data-dialog="entwicklungen" aria-keyshortcuts="E" aria-haspopup="dialog"></button>
      <button class="kurz" type="button" data-dialog="rat" aria-keyshortcuts="R" aria-haspopup="dialog"></button>
      <button class="kurz" type="button" data-dialog="chronik" aria-keyshortcuts="C" aria-haspopup="dialog"></button>
    </nav>
    <button class="icon-btn menu-knopf" id="menu-knopf" type="button" aria-haspopup="dialog" aria-keyshortcuts="Escape"
      data-t-aria-label="shell.menu.open" data-t-title="shell.menu.open">
      <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4.5 7h15 M4.5 12h15 M4.5 17h15"/></svg>
    </button>
  </header>

  <main class="brett" id="brett">
    <canvas id="karte" tabindex="0" role="application" data-t-aria-roledescription="board.map.role"
      data-t-aria-label="board.map.label"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="kartenwerkzeug ebenen" role="radiogroup" data-t-aria-label="board.layer.group" id="ebenen"></div>
    <nav class="kartenwerkzeug module" id="module" data-t-aria-label="board.module.group" hidden></nav>

    <aside class="ratsleiste" id="ratsleiste" data-t-aria-label="board.council.bar"></aside>

    <div class="kartenwerkzeug zoom" id="zoom"></div>
    <canvas class="minimap" id="minimap" aria-hidden="true"></canvas>

    <nav class="ortsliste" id="ortsliste" data-t-aria-label="board.list.label" tabindex="-1"></nav>

    <div class="chronikband" id="chronikband" hidden></div>
    <div class="saisonkarte" id="saisonkarte" aria-hidden="true" hidden></div>

    <aside class="seitenpanel" id="kontext" aria-labelledby="kontext-titel" hidden></aside>
    <aside class="seitenpanel" id="weltgeschehen" aria-labelledby="wg-titel" hidden></aside>
  </main>

  <footer class="zugleiste" id="zugleiste">
    <section class="zug-bereich" aria-labelledby="befehle-titel">
      <h2 class="sr-only" id="befehle-titel" data-t="board.orders.heading"></h2>
      <div class="budget" id="budget"></div>
      <ol class="befehle plain" id="befehle"></ol>
    </section>
    <section aria-labelledby="meldungen-titel" class="meldungen-bereich">
      <h2 class="sr-only" id="meldungen-titel" data-t="board.messages.heading"></h2>
      <ul class="meldungen plain" id="meldungen"></ul>
    </section>
    <div class="blocker" id="blocker"></div>
    <button class="zug-beenden" id="zug-beenden" type="button"></button>
  </footer>

  <dialog class="overlay overlay-voll" id="dlg-entwicklungen" aria-labelledby="dlg-entwicklungen-titel"></dialog>
  <dialog class="overlay" id="dlg-rat" aria-labelledby="dlg-rat-titel"></dialog>
  <dialog class="overlay overlay-lesen" id="dlg-chronik" aria-labelledby="dlg-chronik-titel"></dialog>
  <dialog class="overlay" id="dlg-bestimmung" aria-labelledby="dlg-bestimmung-titel"></dialog>
  <dialog class="overlay overlay-klein" id="dlg-probe" aria-labelledby="dlg-probe-titel"></dialog>
  <dialog class="overlay overlay-ereignis" id="dlg-ereignis" aria-labelledby="dlg-ereignis-titel"></dialog>
  <dialog class="overlay overlay-klein" id="dlg-menu" aria-labelledby="dlg-menu-titel"></dialog>
  <dialog class="overlay overlay-klein" id="dlg-einstellungen" aria-labelledby="dlg-einstellungen-titel"></dialog>
  <dialog class="overlay overlay-lesen" id="dlg-regeln" aria-labelledby="dlg-regeln-titel"></dialog>
  <dialog class="overlay overlay-lesen" id="dlg-ende" aria-labelledby="dlg-ende-titel"></dialog>

  <section class="start" id="start" hidden aria-label="RealmCraft"></section>

  <div class="sr-only" id="ansage" aria-live="polite"></div>
</body>
</html>
